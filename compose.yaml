services:
  claims-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      CLAIMS_DB_PATH: /app/data/claims.db
      CORE_BASE_URL: ${CORE_BASE_URL:-http://host.docker.internal:8081}
    volumes:
      - claims-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -c
      - >-
        python -m life_claims.infrastructure.init_claims_db
        && exec uvicorn life_claims.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  claims-data:
