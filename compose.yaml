services:
  claims-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      CLAIMS_DB_PATH: /app/data/claims.db
      CORE_BASE_URL: http://core-simulado:8081
    volumes:
      - claims-data:/app/data
    depends_on:
      core-simulado:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - >-
        python -m life_claims.infrastructure.init_claims_db
        && exec uvicorn life_claims.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped


  core-simulado:
    image: python:3.12-slim
    working_dir: /core
    volumes:
      - ./kit_prueba_tecnica/core_simulado:/core:ro
    command:
      - python
      - core_simulado.py
    expose:
      - "8081"
    restart: unless-stopped

volumes:
  claims-data:
